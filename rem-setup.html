<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在配置 Rem 专属女仆与 OpenClaw... 💙</title>
  <style>
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; color: #79c0ff; }
    p { color: #8b949e; line-height: 1.5; font-size: 0.95rem; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(121, 192, 255, 0.2);
      border-left-color: #79c0ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 16px;
      background: #238636;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>雷姆 (Rem) 专属一键接入 💙</h1>
    <div class="spinner" id="spin"></div>
    <p id="status">正在将雷姆角色卡与 OpenClaw 加密通道（https://cc562a193a702f.lhr.life/v1）自动写入配置...</p>
    <a href="./" class="btn" id="go-btn" style="display:none;">配置完毕！进入 AIRI 舞台 ➔</a>
  </div>

  <script>
    async function setupRem() {
      try {
        localStorage.setItem('onboarding/completed', 'true');
        localStorage.setItem('onboarding/skipped', 'true');

        localStorage.setItem('settings/consciousness/active-provider', 'openai-compatible');
        localStorage.setItem('settings/consciousness/active-model', 'rem-openclaw');
        localStorage.setItem('settings/consciousness/active-custom-model', 'rem-openclaw');
        localStorage.setItem('settings/language', 'zh-CN');

        const req = indexedDB.open('airi-local');
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('unstorage')) {
            db.createObjectStore('unstorage');
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          try {
            const tx = db.transaction('unstorage', 'readwrite');
            const store = tx.objectStore('unstorage');

            const openclawProvider = {
              id: 'openclaw-rem-provider',
              definitionId: 'openai-compatible',
              name: 'OpenClaw Rem 💙',
              config: {
                baseUrl: 'https://cc562a193a702f.lhr.life/v1',
                apiKey: 'rem'
              },
              validated: true,
              validationBypassed: false
            };

            store.put({ 'openclaw-rem-provider': openclawProvider }, 'local:providers');

            tx.oncomplete = finishSetup;
            tx.onerror = finishSetup;
          } catch(err) {
            finishSetup();
          }
        };
        req.onerror = finishSetup;
      } catch (e) {
        finishSetup();
      }
    }

    function finishSetup() {
      document.getElementById('spin').style.display = 'none';
      document.getElementById('status').innerText = '✨ 成功写入雷姆公网通道配置！正在自动进入 AIRI 舞台...';
      document.getElementById('go-btn').style.display = 'inline-block';
      setTimeout(() => {
        window.location.href = './';
      }, 800);
    }

    setupRem();
  </script>
</body>
</html>
